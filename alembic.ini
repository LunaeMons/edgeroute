# Alembic configuration: database schema migrations.
#
# Apply pending migrations:      make migrate      (the app also does this at start-up)
# Create a migration after changing a model:
#   uv run alembic revision --autogenerate --rev-id 0002 -m "add notes to cdn"
# then READ the generated file in migrations/versions/ before committing it.
#
# The database URL is not set here: migrations/env.py reads it from the app's settings
# (EDGEROUTE_DB_PATH), so migrations always run against the same database as the app.

[alembic]
script_location = %(here)s/migrations
# Name files <revision>_<message>.py, e.g. 0002_add_notes_to_cdn.py.
file_template = %%(rev)s_%%(slug)s
prepend_sys_path = .
# Split path lists the way the operating system does.
path_separator = os
